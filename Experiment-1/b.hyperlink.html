<!DOCTYPE html>
<html>
<head>
    <title>HTML Hyperlinks</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f8f2;
            margin: 40px;
        }

        h1 {
            text-align: center;
            color: darkgreen;
            background-color: #d8f3dc;
            padding: 15px;
            border-radius: 10px;
        }

        .box {
            background-color: white;
            width: 500px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        a {
            color: green;
            font-size: 18px;
            text-decoration: none;
        }

        a:hover {
            color: red;
            text-decoration: underline;
        }

        p {
            margin: 20px;
        }
    </style>
</head>

<body>

<h1>HTML Hyperlinks</h1>

<div class="box">

    <p>
        <a href="https://www.google.com" target="_blank">
            Open Google in New Tab
        </a>
    </p>

    <p>
        <a href="https://www.wikipedia.org" target="_self">
            Open Wikipedia in Same Tab
        </a>
    </p>

    <p>
        <a href="https://www.youtube.com" target="_blank">
            Open YouTube in New Tab
        </a>
    </p>

    <p>
        <a href="profile.html" target="_self">
            Open My Profile
        </a>
    </p>

</div>

</body>
</html>
